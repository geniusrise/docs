site_name: geniusrise docs
site_url: https://docs.geniusrise.com
site_description: Run open LLM, STT and TTS models on your own infrastructure.
repo_url: https://github.com/geniusrise/geniusrise
repo_name: geniusrise/geniusrise

theme:
    name: material
    palette:
        scheme: slate
        primary: pink
        accent: deep purple
    font:
        text: Inconsolata
        code: Kode Mono
    logo: assets/logo_with_text.png
    features:
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.tracking
        - navigation.sections
        - header.autohide
        - content.code.copy
        - content.code.select

extra_css:
    - main.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - The deploy file: deploy-yaml.md
  - CLI and GUI: cli.md
  - Models and catalog: catalog.md
  - Budgets and limits: budget.md
  - Providers:
      - AWS: providers/aws.md
      - SSH / bare metal: providers/ssh.md
      - GCP: providers/gcp.md
      - Azure: providers/azure.md
      - RunPod: providers/runpod.md
      - Lambda / Hyperbolic: providers/neoclouds.md
  - Architecture: architecture.md
  - Security: security.md
  - Development:
      - Layout and testing: dev/testing.md
      - Adding a provider: dev/new-provider.md
      - Contributing recipes: dev/recipes.md

markdown_extensions:
    - admonition
    - toc:
          permalink: true
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - tables
