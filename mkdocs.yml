site_name: geniusrise docs
site_url: https://docs.geniusrise.ai
site_description: Run open LLM, STT and TTS models on your own infrastructure.
repo_url: https://github.com/geniusrise/geniusrise
repo_name: geniusrise/geniusrise

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle: { icon: material/weather-night, name: dark mode }
    - scheme: slate
      primary: deep purple
      toggle: { icon: material/weather-sunny, name: light mode }
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - The deploy file: deploy-yaml.md
  - CLI and GUI: cli.md
  - Models and catalog: catalog.md
  - Budgets and limits: budget.md
  - Providers:
      - AWS: providers/aws.md
      - SSH / bare metal: providers/ssh.md
      - GCP: providers/gcp.md
      - Azure: providers/azure.md
      - RunPod: providers/runpod.md
      - Lambda / Hyperbolic: providers/neoclouds.md
  - Architecture: architecture.md
  - Security: security.md
  - Development:
      - Layout and testing: dev/testing.md
      - Adding a provider: dev/new-provider.md
      - Contributing recipes: dev/recipes.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
